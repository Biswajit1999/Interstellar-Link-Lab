<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img"><title>Photon-counting optical link block diagram</title><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#35677c"/></marker></defs><rect width="1200" height="620" fill="#fff"/><text x="32" y="42" font-size="26" font-family="Arial" fill="#183040">Photon Frontier / end-to-end reference channel</text><text x="32" y="70" font-size="13" font-family="Arial" fill="#536974">Simulation only: fresh information is received no earlier than physical propagation plus transmission duration.</text><rect x="30" y="130" width="206" height="74" rx="9" fill="#f1f5f6" stroke="#32526a" stroke-width="1.5"/><text x="133" y="155" text-anchor="middle" fill="#183040" font-family="Arial" font-size="16" font-weight="bold">Observed data</text><text x="133" y="177" text-anchor="middle" fill="#536974" font-family="Arial" font-size="12">timestamp / innovation</text><rect x="266" y="130" width="206" height="74" rx="9" fill="#f1f5f6" stroke="#32526a" stroke-width="1.5"/><text x="369" y="155" text-anchor="middle" fill="#183040" font-family="Arial" font-size="16" font-weight="bold">Frame + CRC</text><text x="369" y="177" text-anchor="middle" fill="#536974" font-family="Arial" font-size="12">length / sequence</text><path d="M236 167L266 167" stroke="#35677c" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="502" y="130" width="206" height="74" rx="9" fill="#f1f5f6" stroke="#32526a" stroke-width="1.5"/><text x="605" y="155" text-anchor="middle" fill="#183040" font-family="Arial" font-size="16" font-weight="bold">FEC + PPM</text><text x="605" y="177" text-anchor="middle" fill="#536974" font-family="Arial" font-size="12">bitwise pulse mapper</text><path d="M472 167L502 167" stroke="#35677c" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="738" y="130" width="206" height="74" rx="9" fill="#f1f5f6" stroke="#32526a" stroke-width="1.5"/><text x="841" y="155" text-anchor="middle" fill="#183040" font-family="Arial" font-size="16" font-weight="bold">Laser terminal</text><text x="841" y="177" text-anchor="middle" fill="#536974" font-family="Arial" font-size="12">point ahead / interlock</text><path d="M708 167L738 167" stroke="#35677c" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="974" y="130" width="206" height="74" rx="9" fill="#f1f5f6" stroke="#32526a" stroke-width="1.5"/><text x="1077" y="155" text-anchor="middle" fill="#183040" font-family="Arial" font-size="16" font-weight="bold">Optical path</text><text x="1077" y="177" text-anchor="middle" fill="#536974" font-family="Arial" font-size="12">diffraction / noise</text><path d="M944 167L974 167" stroke="#35677c" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="30" y="380" width="206" height="74" rx="9" fill="#f1f5f6" stroke="#32526a" stroke-width="1.5"/><text x="133" y="405" text-anchor="middle" fill="#183040" font-family="Arial" font-size="16" font-weight="bold">Accepted bits</text><text x="133" y="427" text-anchor="middle" fill="#536974" font-family="Arial" font-size="12">CRC-valid only</text><rect x="266" y="380" width="206" height="74" rx="9" fill="#f1f5f6" stroke="#32526a" stroke-width="1.5"/><text x="369" y="405" text-anchor="middle" fill="#183040" font-family="Arial" font-size="16" font-weight="bold">Soft Viterbi</text><text x="369" y="427" text-anchor="middle" fill="#536974" font-family="Arial" font-size="12">error correction</text><path d="M266 417L236 417" stroke="#35677c" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="502" y="380" width="206" height="74" rx="9" fill="#f1f5f6" stroke="#32526a" stroke-width="1.5"/><text x="605" y="405" text-anchor="middle" fill="#183040" font-family="Arial" font-size="16" font-weight="bold">Photon slot counts</text><text x="605" y="427" text-anchor="middle" fill="#536974" font-family="Arial" font-size="12">Poisson LLRs</text><path d="M502 417L472 417" stroke="#35677c" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="738" y="380" width="206" height="74" rx="9" fill="#f1f5f6" stroke="#32526a" stroke-width="1.5"/><text x="841" y="405" text-anchor="middle" fill="#183040" font-family="Arial" font-size="16" font-weight="bold">Receiver terminal</text><text x="841" y="427" text-anchor="middle" fill="#536974" font-family="Arial" font-size="12">TDC / filter / SPAD</text><path d="M738 417L708 417" stroke="#35677c" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="974" y="380" width="206" height="74" rx="9" fill="#f1f5f6" stroke="#32526a" stroke-width="1.5"/><text x="1077" y="405" text-anchor="middle" fill="#183040" font-family="Arial" font-size="16" font-weight="bold">Null propagation</text><text x="1077" y="427" text-anchor="middle" fill="#536974" font-family="Arial" font-size="12">light-time bound</text><path d="M974 417L944 417" stroke="#35677c" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M1080 204L1080 380" stroke="#35677c" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M132 204V380" stroke="#a1a8aa" stroke-width="1.5" stroke-dasharray="5 5"/><text x="152" y="280" font-size="13" font-family="Arial" fill="#536974">Shared prior</text><text x="152" y="297" font-size="13" font-family="Arial" fill="#536974">not a decoded observation</text><text x="32" y="543" font-size="16" font-family="Arial" fill="#183040">t_complete ≥ t_emission + t_light + N_symbols × M × T_slot</text><text x="32" y="573" font-size="13" font-family="Arial" fill="#536974">Not shown: spacecraft acquisition, clock recovery, pointing error distribution, cryogenics and hardware qualification.</text></svg>