<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" role="img"><title>3.3 V low-voltage LED to phototransistor timing loopback circuit reference</title><rect width="1180" height="620" fill="white"/><g font-family="Arial" fill="#19323d"><text x="35" y="51" font-size="25" font-weight="bold">Low-voltage optical timing loopback</text><text x="35" y="77" font-size="14" fill="#576a73">3.3 V visible LED → phototransistor / Schmitt input. Conceptual circuit, not SPAD hardware.</text><rect x="35" y="174" width="165" height="110" rx="10" fill="#edf4f7" stroke="#38566d" stroke-width="2"/><text x="118" y="207" text-anchor="middle" font-weight="bold" font-size="16">MCU or FPGA</text><text x="118" y="229" text-anchor="middle" font-size="13">3.3 V pulse GPIO</text><text x="118" y="250" text-anchor="middle" font-size="13">current limit: verify</text><g stroke="#243c49" fill="none" stroke-width="3"><path d="M200 229H273M273 229l15 -13 18 26 18 -26 18 26 16 -13H418"/><path d="M418 229H448"/><path d="M448 201L448 257L490 229Z"/><path d="M501 201V257M501 229H545V324"/><path d="M529 324H561M534 332H556M541 340H549"/></g><text x="316" y="183" font-size="15" text-anchor="middle">R1 = 330 Ω</text><text x="478" y="183" font-size="15" text-anchor="middle">D1 (LED)</text><g stroke="#af7447" fill="none" stroke-width="2"><path d="M482 197L507 172m-3 23 25 -24"/><path d="M503 172l9 1 -1 10m15 -12 9 1 -1 10"/></g><path d="M571 229H711" stroke="#af7447" stroke-width="3" stroke-dasharray="8 9"/><path d="M704 222l13 7 -13 8" fill="none" stroke="#af7447" stroke-width="3"/><text x="641" y="205" font-size="14" text-anchor="middle" fill="#af7447">light</text><path d="M685 137V395" stroke="#c3cbd0" stroke-width="1.5" stroke-dasharray="7 6"/><text x="695" y="154" font-size="13">optically isolated path</text><g stroke="#243c49" stroke-width="3" fill="none"><path d="M797 205V252"/><path d="M797 217L848 182H902"/><path d="M797 239L848 277V345"/><path d="M831 271l17 6 -5 -17"/><path d="M832 345H864M839 354H857M845 363H851"/><path d="M902 182H1000"/><path d="M1000 182v-40"/><path d="M1000 142l12 -13 15 26 15 -26 15 26 15 -13h20"/><path d="M902 182v47h44"/></g><text x="1014" y="105" font-size="15">R2 = 10 kΩ</text><text x="1088" y="133" font-size="16">+3.3 V</text><rect x="946" y="188" width="198" height="96" rx="10" fill="#edf4f7" stroke="#38566d" stroke-width="2"/><text x="1044" y="217" font-size="16" text-anchor="middle" font-weight="bold">Schmitt input</text><text x="1044" y="241" font-size="13" text-anchor="middle">to 3.3 V timer / FPGA</text><text x="1044" y="261" font-size="13" text-anchor="middle">scope-test threshold</text><text x="793" y="170" font-size="15">Q1 phototransistor</text><path d="M755 205l29 21m-32 4 28 20" stroke="#af7447" stroke-width="2"/><path d="M774 224l11 4 -5 -11m-4 31 10 3 -5 -10" stroke="#af7447" fill="none" stroke-width="2"/><rect x="35" y="435" width="1110" height="128" fill="#f3f5f5" rx="10"/><text x="55" y="469" font-size="17" font-weight="bold">Reference limits</text><text x="55" y="498" font-size="14">Nominal R1 current ≈ (3.3 V − 2.0 V) / 330 Ω = 3.94 mA; use actual LED and GPIO limits.</text><text x="55" y="523" font-size="14">Q1 phototransistor speed, pull-up value, light shielding and hysteresis require experimental characterization.</text><text x="55" y="548" font-size="14">This demonstrates timing and framing only; it is not a single-photon counter, laser driver or flight schematic.</text></g></svg>