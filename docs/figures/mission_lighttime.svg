<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 375" role="img" aria-label="From a new bit to a distant receiver">
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#183448}.title{font-weight:700;font-size:26px}.sub{font-size:13px;fill:#4d6877}.box{fill:#eef6fa;stroke:#54788c;stroke-width:1.6}.label{font-weight:700;font-size:15px}.little{font-size:12px;fill:#4c6575}.wire{stroke:#23708c;stroke-width:2.5;fill:none}.orange{stroke:#be6c30;fill:none;stroke-width:2.4}</style><rect width="1200" height="375" fill="white"/><text class="title" x="32" y="44">From a new bit to a distant receiver</text><text class="sub" x="32" y="69">Illustrative static Earth-Proxima separation, not an ephemeris</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#23708c"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be6c30"/></marker></defs><rect x="52" y="145" width="1090" height="108" rx="18" fill="#eaf4f8"/><circle cx="95" cy="194" r="30" fill="#197395"/><circle cx="1090" cy="194" r="30" fill="#c87632"/><path d="M 140 194 L 1048 194" class="wire" stroke-width="8" marker-end="url(#arr)"/><text x="50" y="129" font-size="18">Earth: fresh message chosen</text><text x="855" y="129" font-size="18">Proxima: earliest ordinary light arrival</text><text x="480" y="177" font-size="19">4.24 light-years</text><text x="458" y="226" font-size="17">about 4.24 years of light time</text><rect x="150" y="277" width="890" height="62" rx="12" fill="#fff2e8"/><text x="178" y="303" font-size="16">A better modem sends MORE reliable bits in the beam.</text><text x="178" y="327" font-size="16">It does not make a freshly chosen bit arrive earlier than light.</text></svg>