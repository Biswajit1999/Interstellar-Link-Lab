ass="label" text-anchor="middle">Soft decoder</text><text x="840.5" y="339" class="little" text-anchor="middle">FEC + Viterbi</text><path d="M 706 322 L 737 322" class="wire"  marker-end="url(#arr)"/><rect x="979" y="282" width="195" height="80" rx="11" fill="#f4f6f9" stroke="#5c7d8c" stroke-width="1.4"/><text x="1076.5" y="315" class="label" text-anchor="middle">Frame check</text><text x="1076.5" y="339" class="little" text-anchor="middle">CRC success / failure</text><path d="M 942 322 L 973 322" class="wire"  marker-end="url(#arr)"/><rect x="1215" y="282" width="195" height="80" rx="11" fill="#f4f6f9" stroke="#5c7d8c" stroke-width="1.4"/><text x="1312.5" y="315" class="label" text-anchor="middle">Fresh reconstruction</text><text x="1312.5" y="339" class="little" text-anchor="middle">new bits only</text><path d="M 1178 322 L 1209 322" class="wire"  marker-end="url(#arr)"/><path d="M 1312.5 210 v28 H 132.5 V282" fill="none" stroke="#bb692e" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#arrO)"/><text x="660" y="267" text-anchor="middle" class="little">Long-distance propagation, severe diffraction loss, clock drift, stellar background</text><text x="720" y="420" text-anchor="middle" font-size="14">Positive CRC = intact simulated packet. Missing packets require retry, erasure flag or labelled prediction.</text></svg>