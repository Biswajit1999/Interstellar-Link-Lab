<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 427" role="img" aria-label="Why Alice cannot choose Bob's distant result">
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#183448}.title{font-weight:700;font-size:26px}.sub{font-size:13px;fill:#4d6877}.box{fill:#eef6fa;stroke:#54788c;stroke-width:1.6}.label{font-weight:700;font-size:15px}.little{font-size:12px;fill:#4c6575}.wire{stroke:#23708c;stroke-width:2.5;fill:none}.orange{stroke:#be6c30;fill:none;stroke-width:2.4}</style><rect width="1150" height="427" fill="white"/><text class="title" x="32" y="44">Why Alice cannot choose Bob's distant result</text><text class="sub" x="32" y="69">Bell state |Phi+&gt;: different joint correlations, identical receiver-only marginal distribution</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#23708c"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be6c30"/></marker></defs><rect x="75" y="112" width="290" height="77" rx="11" fill="#eef6fa" stroke="#5c7d8c" stroke-width="1.4"/><text x="220" y="143.5" class="label" text-anchor="middle">Alice chooses basis</text><text x="220" y="167.5" class="little" text-anchor="middle">Z or X, random</text><rect x="770" y="112" width="290" height="77" rx="11" fill="#eef6fa" stroke="#5c7d8c" stroke-width="1.4"/><text x="915" y="143.5" class="label" text-anchor="middle">Bob measures Z</text><text x="915" y="167.5" class="little" text-anchor="middle">sees only local outcomes</text><path d="M365 150 H770" class="orange" stroke-dasharray="10 8"/><text x="470" y="130" font-size="17">Shared entanglement</text><rect x="120" y="230" width="400" height="117" rx="14" fill="#eff6f9"/><rect x="640" y="230" width="400" height="117" rx="14" fill="#eff6f9"/><rect x="164" y="274" width="300" height="32" rx="6" fill="#d1e0e7"/><rect x="164" y="274" width="150" height="32" rx="6" fill="#1b7b9c"/><rect x="684" y="274" width="300" height="32" rx="6" fill="#d1e0e7"/><rect x="684" y="274" width="150" height="32" rx="6" fill="#1b7b9c"/><text x="190" y="255" font-size="16">Alice Z: P(Bob=0) = 50%</text><text x="710" y="255" font-size="16">Alice X: P(Bob=0) = 50%</text><text x="120" y="383" font-size="16">Bob alone sees no reliable distinction. Comparing both records later reveals the correlations.</text></svg>